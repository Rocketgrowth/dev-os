[build]
  base = "contractiq"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # These are plain config values, not secrets - their values (e.g. "gpt-4o", "10",
  # "true") naturally occur throughout node_modules, docs, and .env.example, which
  # floods Netlify's secrets scanner with false positives and fails the build.
  # The real secrets (OPENAI_API_KEY, SUPABASE_SERVICE_ROLE_KEY) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_ENABLE_PDF_VIEWER,OPENAI_MODEL,OPENAI_MAX_TOKENS_EXTRACTION,OPENAI_MAX_TOKENS_CHAT,OPENAI_TEMPERATURE_EXTRACTION,OPENAI_TEMPERATURE_CHAT,OPENAI_MAX_RETRIES,RATE_LIMIT_AI_REQUESTS_PER_MINUTE,RATE_LIMIT_UPLOAD_REQUESTS_PER_MINUTE,MAX_FILE_SIZE_MB,MAX_PAGE_COUNT,MIN_EXTRACTED_WORDS,MAX_CHAT_HISTORY"

  # Next.js embeds resolved server-only env var values (e.g. OPENAI_API_KEY,
  # SUPABASE_SERVICE_ROLE_KEY) into its own incremental webpack build cache for
  # faster rebuilds. That cache is never served to users - it's build-internal -
  # so scanning it for secrets is a false positive. Exclude it.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"
